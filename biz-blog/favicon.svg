<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0066CC"/>
      <stop offset="100%" stop-color="#002753"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Shine overlay (top half) -->
  <rect width="32" height="16" rx="7" fill="rgba(255,255,255,0.13)"/>
  <!-- Bar chart: 3 ascending bars -->
  <rect x="5"  y="21" width="6" height="7"  rx="1.2" fill="white"/>
  <rect x="13" y="14" width="6" height="14" rx="1.2" fill="white"/>
  <rect x="21" y="7"  width="6" height="21" rx="1.2" fill="white"/>
  <!-- Trend line connecting bar tops -->
  <polyline points="8,21 16,14 24,7" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
