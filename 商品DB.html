<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商品DBシステム</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Meiryo,sans-serif;font-size:13px;background:#f0f2f5;color:#222}
#app{display:flex;flex-direction:column;height:100vh}
#topbar{background:#1a56db;color:#fff;padding:8px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0}
#topbar h1{font-size:15px;font-weight:600;white-space:nowrap}
#search{flex:1;padding:5px 10px;border-radius:4px;border:none;font-size:13px}
.btn{padding:5px 12px;border:none;border-radius:4px;cursor:pointer;font-size:12px;font-weight:600}
.btn-add{background:#fff;color:#1a56db}
.btn-export{background:#16a34a;color:#fff}
.btn-import{background:#7c3aed;color:#fff}
.btn-link{background:#0891b2;color:#fff}
input[type=checkbox]{width:14px;height:14px;cursor:pointer;accent-color:#1a56db;flex-shrink:0}
.item-row{display:flex;align-items:flex-start;gap:8px}
.item-row-text{flex:1;min-width:0}
.select-bar{padding:4px 10px;background:#eff6ff;border-bottom:1px solid #ddd;font-size:11px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.select-bar label{display:flex;align-items:center;gap:4px;cursor:pointer}
th.chk-col,td.chk-col{width:28px;text-align:center;padding:4px}
#main{display:flex;flex:1;overflow:hidden}
#sidebar{width:280px;min-width:200px;background:#fff;border-right:1px solid #ddd;display:flex;flex-direction:column;overflow:hidden}
#sidebar-header{padding:8px 10px;background:#f8fafc;border-bottom:1px solid #ddd;font-weight:600;font-size:12px;color:#555}
#item-list{flex:1;overflow-y:auto}
.item-row{padding:8px 12px;cursor:pointer;border-bottom:1px solid #f0f0f0;transition:background .1s}
.item-row:hover{background:#eff6ff}
.item-row.active{background:#dbeafe;border-left:3px solid #1a56db}
.item-row .series-id{font-size:11px;color:#888}
.item-row .series-name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#detail{flex:1;display:flex;flex-direction:column;overflow:hidden}
#detail-header{padding:10px 16px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:10px}
#detail-title{font-size:15px;font-weight:600}
.btn-edit{background:#f59e0b;color:#fff;padding:4px 10px;font-size:12px}
.btn-del{background:#ef4444;color:#fff;padding:4px 10px;font-size:12px}
#detail-body{flex:1;overflow-y:auto;padding:16px}
.section{background:#fff;border-radius:6px;border:1px solid #e5e7eb;margin-bottom:14px}
.section-title{padding:8px 14px;background:#f8fafc;border-bottom:1px solid #e5e7eb;font-weight:600;font-size:12px;color:#444;display:flex;align-items:center;justify-content:space-between}
.spec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0}
.spec-item{padding:6px 14px;border-bottom:1px solid #f5f5f5;display:flex;gap:8px}
.spec-label{color:#666;font-size:11px;min-width:120px;flex-shrink:0}
.spec-value{color:#111;font-size:12px;word-break:break-all}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#f1f5f9;padding:6px 10px;text-align:left;border-bottom:2px solid #ddd;white-space:nowrap;font-size:11px;position:sticky;top:0}
td{padding:5px 10px;border-bottom:1px solid #f0f0f0}
tr:hover td{background:#f8faff}
tr.unit-row{cursor:pointer}
.badge{display:inline-block;padding:1px 6px;border-radius:10px;font-size:10px;background:#dbeafe;color:#1e40af}
#empty{display:flex;align-items:center;justify-content:center;height:100%;color:#aaa;font-size:14px}
/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:8px;padding:20px;width:680px;max-width:95vw;max-height:90vh;overflow-y:auto}
.modal h2{font-size:15px;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid #eee}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group.full{grid-column:1/-1}
.form-group label{font-size:11px;color:#555;font-weight:600}
.form-group input,.form-group textarea,.form-group select{padding:6px 8px;border:1px solid #ddd;border-radius:4px;font-size:12px;font-family:inherit}
.form-group textarea{resize:vertical;min-height:60px}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.btn-cancel{background:#e5e7eb;color:#333}
.btn-save{background:#1a56db;color:#fff}
/* Unit detail panel */
#unit-overlay{display:none;position:fixed;right:0;top:0;height:100vh;width:500px;background:#fff;box-shadow:-4px 0 20px rgba(0,0,0,.15);z-index:50;overflow-y:auto;flex-direction:column}
#unit-overlay.show{display:flex}
#unit-overlay-header{padding:12px 16px;background:#1a56db;color:#fff;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#unit-overlay-body{padding:16px;flex:1;overflow-y:auto}
.close-btn{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;line-height:1}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <h1>🗂 商品DBシステム</h1>
    <input id="search" type="text" placeholder="シリーズ名・型番で検索...">
    <button class="btn btn-add" onclick="openAddItem()">＋ 商品追加</button>
    <button class="btn btn-add" onclick="openAddUnit()">＋ ユニット追加</button>
    <button class="btn btn-export" onclick="exportCSV()">⬇ CSV出力</button>
    <button class="btn btn-link" onclick="exportLinkCSV()">⬇ リンク出力</button>
    <button class="btn btn-import" onclick="openImport()">⬆ CSV取込</button>
    <input type="file" id="csv-file-input" accept=".csv" style="display:none" onchange="onCSVFileSelected(event)">
  </div>
  <div id="main">
    <div id="sidebar">
      <div id="sidebar-header">商品（シリーズ）一覧 <span id="item-count"></span></div>
      <div class="select-bar">
        <label><input type="checkbox" id="item-select-all" onchange="toggleAllItems(this.checked)"> 全選択</label>
        <span id="item-selected-count" style="color:#1a56db;font-weight:600"></span>
        <button id="item-bulk-del" class="btn btn-del" onclick="bulkDeleteItems()" style="display:none;padding:2px 8px;font-size:11px">選択削除</button>
      </div>
      <div id="item-list"></div>
    </div>
    <div id="detail">
      <div id="detail-header" style="display:none">
        <div id="detail-title"></div>
        <div style="display:flex;gap:6px;margin-left:auto">
          <button class="btn btn-edit" onclick="editCurrentItem()">編集</button>
          <button class="btn btn-del" onclick="deleteCurrentItem()">削除</button>
        </div>
      </div>
      <div id="detail-body">
        <div id="empty">← 左から商品を選択してください</div>
      </div>
    </div>
  </div>
</div>

<!-- Import modal -->
<div id="import-modal" class="modal-overlay">
  <div class="modal" style="width:520px">
    <h2>📥 CSV取込</h2>
    <div style="margin-bottom:12px">
      <div style="margin-bottom:8px;font-size:12px;color:#555">取込データ種別を選択してください：</div>
      <div style="display:flex;gap:10px;margin-bottom:14px">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px">
          <input type="radio" name="import-type" value="items" id="import-type-items"> 商品（シリーズ）
        </label>
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px">
          <input type="radio" name="import-type" value="units" id="import-type-units" checked> ユニット
        </label>
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px">
          <input type="radio" name="import-type" value="links" id="import-type-links"> リンク情報
        </label>
      </div>
      <div style="background:#f8fafc;border:1px solid #e5e7eb;border-radius:6px;padding:12px;margin-bottom:12px;font-size:12px;color:#555">
        <b>マージルール：</b><br>
        ・商品/ユニット: 既存レコードはID一致で上書き更新、IDが存在しない行は新規追加<br>
        ・CSVにないレコードは削除しない<br>
        ・商品CSV: 識別キー = <code>メジャースペック/シリーズID[ID]</code><br>
        ・ユニットCSV: 識別キー = <code>メジャースペック/ID[ID]</code><br>
        ・リンクCSV: CSV内のリンクで全件置換（追加・削除両対応）
      </div>
    </div>
    <div id="import-progress" style="display:none;margin-bottom:12px">
      <div style="font-size:12px;color:#555;margin-bottom:4px" id="import-progress-label">処理中...</div>
      <div style="background:#e5e7eb;border-radius:4px;height:8px;overflow:hidden">
        <div id="import-progress-bar" style="background:#1a56db;height:100%;width:0%;transition:width .1s"></div>
      </div>
    </div>
    <div id="import-preview" style="display:none;margin-bottom:12px">
      <div id="import-preview-content"></div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn btn-import" onclick="triggerCSVPick()">📂 ファイル選択</button>
      <span id="import-filename" style="font-size:12px;color:#666"></span>
    </div>
    <div class="modal-footer">
      <button class="btn btn-cancel" onclick="closeImport()">キャンセル</button>
      <button class="btn btn-save" id="import-apply-btn" onclick="applyImport()" disabled style="opacity:.5">取込実行</button>
    </div>
  </div>
</div>

<!-- Unit detail overlay -->
<div id="unit-overlay">
  <div id="unit-overlay-header">
    <span id="unit-overlay-title">ユニット詳細</span>
    <button class="close-btn" onclick="closeUnitOverlay()">✕</button>
  </div>
  <div id="unit-overlay-body"></div>
</div>

<!-- Modal -->
<div id="modal" class="modal-overlay">
  <div class="modal">
    <h2 id="modal-title"></h2>
    <div id="modal-form"></div>
    <div class="modal-footer">
      <button class="btn btn-cancel" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-save" onclick="saveModal()">保存</button>
    </div>
  </div>
</div>

function renderSidebar() {
  const q = currentSearchQuery.toLowerCase();
  const filtered = DB.items.filter(it => {
    if (!q) return true;
    return (it[ITEM_SERIES_KEY]||'').toLowerCase().includes(q)
      || (it[ITEM_NAME_KEY]||'').toLowerCase().includes(q)
      || (it[ITEM_LABEL_KEY]||'').toLowerCase().includes(q);
  });
  document.getElementById('item-count').textContent = `(${filtered.length}/${DB.items.length})`;
  const checkedCount = filtered.filter(it=>checkedItems.has(it._id)).length;
  const selCount = document.getElementById('item-selected-count');
  selCount.textContent = checkedCount ? `${checkedCount}件選択中` : '';
  const bulkDelBtn = document.getElementById('item-bulk-del');
  bulkDelBtn.style.display = checkedCount ? '' : 'none';
  const allChk = document.getElementById('item-select-all');
  allChk.checked = filtered.length>0 && filtered.every(it=>checkedItems.has(it._id));
  allChk.indeterminate = checkedCount>0 && !allChk.checked;
  const list = document.getElementById('item-list');
  list.innerHTML = filtered.map(it => `
    <div class="item-row${it._id===selectedItemId?' active':''}">
      <input type="checkbox" ${checkedItems.has(it._id)?'checked':''} onclick="event.stopPropagation();toggleItem(${it._id},this.checked)">
      <div class="item-row-text" onclick="selectItem(${it._id})" style="cursor:pointer">
        <div class="series-id">${esc(it[ITEM_SERIES_KEY]||'')} · ${esc(it[ITEM_LABEL_KEY]||'')}</div>
        <div class="series-name">${esc(it[ITEM_NAME_KEY]||'(名称なし)')}</div>
      </div>
    </div>
  `).join('');
}

function toggleItem(id, checked) {
  if (checked) checkedItems.add(id); else checkedItems.delete(id);
  renderSidebar();
}

function toggleAllItems(checked) {
  const q = currentSearchQuery.toLowerCase();
  const filtered = DB.items.filter(it =>
    !q || (it[ITEM_SERIES_KEY]||'').toLowerCase().includes(q)
      || (it[ITEM_NAME_KEY]||'').toLowerCase().includes(q)
      || (it[ITEM_LABEL_KEY]||'').toLowerCase().includes(q)
  );
  filtered.forEach(it => checked ? checkedItems.add(it._id) : checkedItems.delete(it._id));
  renderSidebar();
}

function selectItem(id) {
  selectedItemId = id;
  renderSidebar();
  renderDetail();
}

function renderDetail() {
  const item = DB.items.find(i=>i._id===selectedItemId);
  const hdr = document.getElementById('detail-header');
  const body = document.getElementById('detail-body');
  if (!item) {
    hdr.style.display='none';
    body.innerHTML='<div id="empty">← 左から商品を選択してください</div>';
    return;
  }
  hdr.style.display='flex';
  document.getElementById('detail-title').textContent = item[ITEM_NAME_KEY]||item[ITEM_SERIES_KEY]||'商品詳細';

  // Get linked units
  const seriesId = item[ITEM_SERIES_KEY];
  const linkedUnitIds = DB.links
    .filter(l=>l[LINK_ITEM_KEY]===seriesId)
    .map(l=>l[LINK_UNIT_KEY]);
  const linkedUnits = DB.units.filter(u=>linkedUnitIds.includes(u[UNIT_ID_KEY]));

  let html = '';
  // Item specs
  html += `<div class="section">
    <div class="section-title">商品（シリーズ）情報</div>
    <div class="spec-grid">`;
  for (const [label, key] of ITEM_DISPLAY) {
    const val = item[key];
    if (val) html += `<div class="spec-item"><span class="spec-label">${esc(label)}</span><span class="spec-value">${esc(String(val))}</span></div>`;
  }
  html += `</div></div>`;

  // Linked units table
  const checkedUnitCount = linkedUnits.filter(u=>checkedUnits.has(u._id)).length;
  html += `<div class="section">
    <div class="section-title">
      ユニット一覧
      <div style="display:flex;gap:6px;align-items:center">
        <span class="badge">${linkedUnits.length}件${checkedUnitCount?` / <b>${checkedUnitCount}件選択</b>`:''}</span>
        <button class="btn btn-add" style="padding:2px 8px;font-size:11px" onclick="openAddUnitForItem()">＋追加</button>
        <button class="btn btn-export" style="padding:2px 8px;font-size:11px" onclick="exportUnitCSV()">CSV出力</button>
        ${checkedUnitCount ? `<button class="btn btn-del" style="padding:2px 8px;font-size:11px" onclick="bulkDeleteUnits(${JSON.stringify(linkedUnits.map(u=>u._id))})">選択削除(${checkedUnitCount}件)</button>` : ''}
      </div>
    </div>
    <div style="overflow-x:auto">
    <table>
      <thead><tr>
        <th class="chk-col"><input type="checkbox" id="unit-select-all" onchange="toggleAllUnits(this.checked,${JSON.stringify(linkedUnits.map(u=>u._id))})"></th>
        ${UNIT_TABLE_COLS.map(([l])=>`<th>${esc(l)}</th>`).join('')}
        <th>操作</th>
      </tr></thead>
      <tbody>
        ${linkedUnits.map(u=>`
          <tr class="unit-row" onclick="showUnitDetail(${u._id})">
            <td class="chk-col" onclick="event.stopPropagation()">
              <input type="checkbox" ${checkedUnits.has(u._id)?'checked':''} onchange="toggleUnit(${u._id},this.checked)">
            </td>
            ${UNIT_TABLE_COLS.map(([,k])=>`<td>${esc(String(u[k]??''))}</td>`).join('')}
            <td onclick="event.stopPropagation()">
              <button class="btn btn-edit" onclick="editUnit(${u._id})" style="padding:2px 8px">編集</button>
              <button class="btn btn-del" onclick="deleteUnit(${u._id})" style="padding:2px 8px;margin-left:4px">削除</button>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
    </div>
  </div>`;

  body.innerHTML = html;
}

function showUnitDetail(id) {
  const u = DB.units.find(u=>u._id===id);
  if (!u) return;
  document.getElementById('unit-overlay-title').textContent = u['メインスペック/表記型番1']||u[UNIT_ID_KEY]||'ユニット詳細';
  let html = '';
  for (const group of UNIT_DETAIL_GROUPS) {
    const rows = group.keys.filter(([,k])=>u[k]!=null&&u[k]!='');
    if (!rows.length) continue;
    html += `<div class="section" style="margin-bottom:12px">
      <div class="section-title">${esc(group.title)}</div>
      <div class="spec-grid">
        ${rows.map(([l,k])=>`<div class="spec-item"><span class="spec-label">${esc(l)}</span><span class="spec-value">${esc(String(u[k]))}</span></div>`).join('')}
      </div>
    </div>`;
  }
  // All fields dump
  const allKeys = Object.keys(u).filter(k=>k!=='_id'&&u[k]!=null&&u[k]!='');
  const shownKeys = new Set(UNIT_DETAIL_GROUPS.flatMap(g=>g.keys.map(([,k])=>k)));
  const remaining = allKeys.filter(k=>!shownKeys.has(k));
  if (remaining.length) {
    html += `<div class="section"><div class="section-title">その他スペック</div><div class="spec-grid">`;
    for (const k of remaining) {
      const label = k.replace('メインスペック/','').replace('メジャースペック/','');
      html += `<div class="spec-item"><span class="spec-label">${esc(label)}</span><span class="spec-value">${esc(String(u[k]))}</span></div>`;
    }
    html += `</div></div>`;
  }
  html += `<div style="margin-top:10px;display:flex;gap:8px">
    <button class="btn btn-edit" onclick="editUnit(${id})">編集</button>
    <button class="btn btn-del" onclick="deleteUnit(${id})">削除</button>
  </div>`;
  document.getElementById('unit-overlay-body').innerHTML = html;
  document.getElementById('unit-overlay').classList.add('show');
}

function closeUnitOverlay() {
  document.getElementById('unit-overlay').classList.remove('show');
}

// --- Modal ---
function openAddItem() {
  modalMode = 'addItem'; modalTargetId = null;
  document.getElementById('modal-title').textContent = '商品（シリーズ）追加';
  document.getElementById('modal-form').innerHTML = buildItemForm({});
  document.getElementById('modal').classList.add('show');
}

function editCurrentItem() {
  const item = DB.items.find(i=>i._id===selectedItemId);
  if (!item) return;
  modalMode = 'editItem'; modalTargetId = item._id;
  document.getElementById('modal-title').textContent = '商品（シリーズ）編集';
  document.getElementById('modal-form').innerHTML = buildItemForm(item);
  document.getElementById('modal').classList.add('show');
}

function openAddUnit() {
  modalMode = 'addUnit'; modalTargetId = null;
  document.getElementById('modal-title').textContent = 'ユニット追加';
  document.getElementById('modal-form').innerHTML = buildUnitForm({});
  document.getElementById('modal').classList.add('show');
}

function openAddUnitForItem() {
  const item = DB.items.find(i=>i._id===selectedItemId);
  modalMode = 'addUnit'; modalTargetId = null;
  const prefill = {_linkedSeries: item?.[ITEM_SERIES_KEY]||''};
  document.getElementById('modal-title').textContent = 'ユニット追加';
  document.getElementById('modal-form').innerHTML = buildUnitForm(prefill);
  document.getElementById('modal').classList.add('show');
}

function editUnit(id) {
  const u = DB.units.find(u=>u._id===id);
  if (!u) return;
  modalMode = 'editUnit'; modalTargetId = id;
  document.getElementById('modal-title').textContent = 'ユニット編集';
  document.getElementById('modal-form').innerHTML = buildUnitForm(u);
  document.getElementById('modal').classList.add('show');
}

    {label:'シリーズID *',key:ITEM_SERIES_KEY,full:false},
    {label:'シリーズ名 *',key:ITEM_NAME_KEY,full:false},
    {label:'シリーズ名（英）',key:'メジャースペック/シリーズ名（英）',full:false},
    {label:'ラベル',key:ITEM_LABEL_KEY,full:false},
    {label:'説明',key:'メジャースペック/説明',full:true,ta:true},
    {label:'コピー',key:'メインスペック/コピー',full:true,ta:true},
    {label:'加工用途',key:'メインスペック/加工用途',full:false},
    {label:'掲載頁',key:'メインスペック/掲載頁',full:false},
    {label:'図面注釈',key:'メインスペック/図面注釈',full:true,ta:true},

    <div class="form-group${f.full?' full':''}">

function saveModal() {
  const form = document.getElementById('modal-form');
  const inputs = form.querySelectorAll('input,textarea,select');
  const vals = {};
  inputs.forEach(el=>{ if(el.name) vals[el.name]=el.value; });

  if (modalMode==='addItem') {
    const newItem = {...vals, _id: Date.now()};
    delete newItem._linkedSeries;
    DB.items.push(newItem);
  } else if (modalMode==='editItem') {
    const idx = DB.items.findIndex(i=>i._id===modalTargetId);
    if (idx>=0) {
      delete vals._linkedSeries;
      DB.items[idx] = {...DB.items[idx], ...vals};
    }
  } else if (modalMode==='addUnit') {
    const linkedSeries = vals._linkedSeries;
    delete vals._linkedSeries;
    const newUnit = {...vals, _id: Date.now()};
    DB.units.push(newUnit);
    if (linkedSeries) {
      DB.links.push({[LINK_ITEM_KEY]:linkedSeries, [LINK_UNIT_KEY]:vals[UNIT_ID_KEY]});
    }
  } else if (modalMode==='editUnit') {
    const linkedSeries = vals._linkedSeries;
    delete vals._linkedSeries;
    const idx = DB.units.findIndex(u=>u._id===modalTargetId);
    if (idx>=0) {
      const oldUnitId = DB.units[idx][UNIT_ID_KEY];
      DB.units[idx] = {...DB.units[idx], ...vals};
      // Update links
      if (linkedSeries) {
        DB.links = DB.links.filter(l=>l[LINK_UNIT_KEY]!==oldUnitId);
        DB.links.push({[LINK_ITEM_KEY]:linkedSeries, [LINK_UNIT_KEY]:vals[UNIT_ID_KEY]||oldUnitId});
      }
    }
  }
  closeModal();
  renderSidebar();
  renderDetail();
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

function deleteCurrentItem() {
  const item = DB.items.find(i=>i._id===selectedItemId);
  if (!item) return;
  if (!confirm(`"${item[ITEM_NAME_KEY]}" を削除しますか？`)) return;
  const sid = item[ITEM_SERIES_KEY];
  DB.items = DB.items.filter(i=>i._id!==selectedItemId);
  DB.links = DB.links.filter(l=>l[LINK_ITEM_KEY]!==sid);
  selectedItemId = null;
  renderSidebar();
  renderDetail();
}

function deleteUnit(id) {
  const u = DB.units.find(u=>u._id===id);
  if (!u) return;
  if (!confirm(`"${u[UNIT_ID_KEY]}" を削除しますか？`)) return;
  const uid = u[UNIT_ID_KEY];
  DB.units = DB.units.filter(u=>u._id!==id);
  DB.links = DB.links.filter(l=>l[LINK_UNIT_KEY]!==uid);
  closeUnitOverlay();
  renderDetail();
}

function bulkDeleteItems() {
  const targets = DB.items.filter(i=>checkedItems.has(i._id));
  if (!targets.length) return;
  if (!confirm(`選択中の商品 ${targets.length}件を削除します。\n関連するリンク情報も削除されます。よろしいですか？`)) return;
  const sids = targets.map(i=>i[ITEM_SERIES_KEY]);
  DB.items = DB.items.filter(i=>!checkedItems.has(i._id));
  DB.links = DB.links.filter(l=>!sids.includes(l[LINK_ITEM_KEY]));
  if (checkedItems.has(selectedItemId)) selectedItemId = null;
  checkedItems.clear();
  renderSidebar();
  renderDetail();
}

function bulkDeleteUnits(allLinkedIds) {
  // Delete only units that are both checked AND in the current item's unit list
  const toDelete = allLinkedIds.filter(id=>checkedUnits.has(id));
  if (!toDelete.length) return;
  const names = toDelete.map(id=>{
    const u = DB.units.find(u=>u._id===id);
    return u ? (u[UNIT_ID_KEY]||id) : id;
  });
  if (!confirm(`選択中のユニット ${toDelete.length}件を削除します。\n\n${names.slice(0,10).join('\n')}${names.length>10?`\n...他${names.length-10}件`:''}\n\nよろしいですか？`)) return;
  const toDeleteSet = new Set(toDelete);
  const uids = toDelete.map(id=>{ const u=DB.units.find(u=>u._id===id); return u?.[UNIT_ID_KEY]; }).filter(Boolean);
  DB.units = DB.units.filter(u=>!toDeleteSet.has(u._id));
  DB.links = DB.links.filter(l=>!uids.includes(l[LINK_UNIT_KEY]));
  toDelete.forEach(id=>checkedUnits.delete(id));
  closeUnitOverlay();
  renderDetail();
}

// CSV Export
function toggleUnit(id, checked) {
  if (checked) checkedUnits.add(id); else checkedUnits.delete(id);
  renderDetail();
}

function toggleAllUnits(checked, ids) {
  ids.forEach(id => checked ? checkedUnits.add(id) : checkedUnits.delete(id));
  renderDetail();
}

function exportCSV() {
  // Export items: checked ones if any, else all
  const targets = checkedItems.size > 0
    ? DB.items.filter(i=>checkedItems.has(i._id))
    : DB.items;
  const label = checkedItems.size > 0 ? `items_selected_${checkedItems.size}` : 'items_all';
  const cols = RAW.item_headers;
  let csv = cols.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')+'\n';
  targets.forEach(it=>{
    csv += cols.map(c=>'"'+String(it[c]??'').replace(/"/g,'""')+'"').join(',')+'\n';
  });
  downloadCSV(csv, `${label}.csv`);
}

function exportUnitCSV() {
  // Export units: checked ones if any, else current item's linked units
  let targets;
  let fname;
  if (checkedUnits.size > 0) {
    targets = DB.units.filter(u=>checkedUnits.has(u._id));
    fname = `units_selected_${checkedUnits.size}.csv`;
  } else {
    const item = DB.items.find(i=>i._id===selectedItemId);
    if (!item) return;
    const seriesId = item[ITEM_SERIES_KEY];
    const linkedUnitIds = DB.links.filter(l=>l[LINK_ITEM_KEY]===seriesId).map(l=>l[LINK_UNIT_KEY]);
    targets = DB.units.filter(u=>linkedUnitIds.includes(u[UNIT_ID_KEY]));
    fname = `units_${seriesId}.csv`;
  }
  const allKeys = [...new Set(targets.flatMap(u=>Object.keys(u).filter(k=>k!=='_id')))];
  let csv = allKeys.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')+'\n';
  targets.forEach(u=>{
    csv += allKeys.map(k=>'"'+String(u[k]??'').replace(/"/g,'""')+'"').join(',')+'\n';
  });
  downloadCSV(csv, fname);
}

function exportLinkCSV() {
  // Export links: only for checked items if any, else all
  let targets;
  let fname;
  if (checkedItems.size > 0) {
    const seriesIds = DB.items.filter(i=>checkedItems.has(i._id)).map(i=>i[ITEM_SERIES_KEY]);
    targets = DB.links.filter(l=>seriesIds.includes(l[LINK_ITEM_KEY]));
    fname = `links_selected.csv`;
  } else {
    targets = DB.links;
    fname = `links_all.csv`;
  }
  const cols = [LINK_ITEM_KEY, LINK_UNIT_KEY];
  let csv = cols.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')+'\n';
  targets.forEach(l=>{
    csv += cols.map(c=>'"'+String(l[c]??'').replace(/"/g,'""')+'"').join(',')+'\n';
  });
  downloadCSV(csv, fname);
}

// --- CSV Import ---
let pendingImportData = null;

function openImport() {
  document.getElementById('import-modal').classList.add('show');
  document.getElementById('import-preview').style.display='none';
  document.getElementById('import-filename').textContent='';
  document.getElementById('import-apply-btn').disabled=true;
  document.getElementById('import-apply-btn').style.opacity='.5';
  pendingImportData = null;
}

function closeImport() {
  document.getElementById('import-modal').classList.remove('show');
}

function triggerCSVPick() {
  document.getElementById('csv-file-input').value='';
  document.getElementById('csv-file-input').click();
}

function onCSVFileSelected(e) {
  const file = e.target.files[0];
  if (!file) return;
  document.getElementById('import-filename').textContent = file.name;
  const reader = new FileReader();
  reader.onload = ev => {
    const buffer = ev.target.result;
    const uint8 = new Uint8Array(buffer);
    let text, detectedEnc;
    // UTF-8 BOM check (EF BB BF)
    if (uint8[0]===0xEF && uint8[1]===0xBB && uint8[2]===0xBF) {
      text = new TextDecoder('utf-8').decode(buffer).slice(1);
      detectedEnc = 'UTF-8 (BOM)';
    } else {
      // Try UTF-8 (strict)
      try {
        text = new TextDecoder('utf-8', {fatal:true}).decode(buffer);
        detectedEnc = 'UTF-8';
      } catch(_) {
        // Fall back to Shift-JIS
        try {
          text = new TextDecoder('shift-jis').decode(buffer);
          detectedEnc = 'Shift-JIS';
        } catch(e2) {
          alert('文字コードの判定に失敗しました。UTF-8またはShift-JISのCSVをご使用ください。');
          return;
        }
      }
    }
    document.getElementById('import-filename').textContent =
      file.name + `  [${detectedEnc}]`;
    setImportProgress(true, 'CSVを解析中...', 0);
    parseCSVAsync(text, pct => setImportProgress(true, `CSVを解析中... ${pct}%`, pct))
      .then(parsed => {
        setImportProgress(false);
        if (!parsed || parsed.length < 1) {
          alert('CSVの読み込みに失敗しました（データ行なし）');
          return;
        }
        pendingImportData = parsed;
        showImportPreview(parsed);
        document.getElementById('import-apply-btn').disabled=false;
        document.getElementById('import-apply-btn').style.opacity='1';
      });
  };
  reader.readAsArrayBuffer(file);
}

function setImportProgress(show, label='', pct=0) {
  const el = document.getElementById('import-progress');
  el.style.display = show ? '' : 'none';
  document.getElementById('import-progress-label').textContent = label;
  document.getElementById('import-progress-bar').style.width = pct + '%';
  document.getElementById('import-preview').style.display = show ? 'none' : '';
}

function parseCSVLine(line) {
  const result = [];
  let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') {
      if (inQ && line[i+1] === '"') { cur += '"'; i++; }
      else inQ = !inQ;
    } else if (c === ',' && !inQ) {
      result.push(cur); cur = '';
    } else { cur += c; }
  }
  result.push(cur);
  return result;
}

function parseCSVAsync(text, onProgress) {
  return new Promise(resolve => {
    const rawLines = text.split(/\r?\n/);
    const headers = parseCSVLine(rawLines[0]);
    const result = [];
    const CHUNK = 3000;
    let i = 1;
    function next() {
      const end = Math.min(i + CHUNK, rawLines.length);
      for (; i < end; i++) {
        const line = rawLines[i];
        if (!line.trim()) continue;
        const row = parseCSVLine(line);
        const obj = {};
        headers.forEach((h, j) => { if (row[j] !== undefined && row[j] !== '') obj[h] = row[j]; });
        result.push(obj);
      }
      if (onProgress) onProgress(Math.min(99, Math.round(i / rawLines.length * 100)));
      if (i < rawLines.length) setTimeout(next, 0);
      else resolve(result);
    }
    setTimeout(next, 0);
  });
}

function showImportPreview(records) {
  const type = document.querySelector('input[name="import-type"]:checked').value;
  let summary = '';
  if (type==='links') {
    const newPairs = new Set(records.map(r=>`${r[LINK_ITEM_KEY]}|${r[LINK_UNIT_KEY]}`));
    const oldPairs = new Set(DB.links.map(l=>`${l[LINK_ITEM_KEY]}|${l[LINK_UNIT_KEY]}`));
    const addCount = [...newPairs].filter(p=>!oldPairs.has(p)).length;
    const removeCount = [...oldPairs].filter(p=>!newPairs.has(p)).length;
    summary = `読込: <b>${records.length}</b>行 ／ 追加: <b style="color:#16a34a">${addCount}</b>件 ／ 削除: <b style="color:#ef4444">${removeCount}</b>件（全件置換）`;
  } else {
    const idKey = type==='items' ? ITEM_SERIES_KEY : UNIT_ID_KEY;
    const arr = type==='items' ? DB.items : DB.units;
    // O(1) lookup with Map
    const existingMap = new Map(arr.map(x=>[x[idKey], true]));
    let newCount=0, updateCount=0;
    records.forEach(r=>{
      const id = r[idKey];
      if (!id) return;
      if (existingMap.has(id)) updateCount++; else newCount++;
    });
    summary = `読込: <b>${records.length}</b>行 ／ 更新: <b style="color:#f59e0b">${updateCount}</b>件 ／ 新規: <b style="color:#16a34a">${newCount}</b>件`;
  }
  const preview = document.getElementById('import-preview');
  preview.style.display='block';
  preview.innerHTML=`<div style="background:#fff;border:1px solid #e5e7eb;border-radius:6px;padding:12px;font-size:12px">
    <div style="margin-bottom:6px"><b>プレビュー（先頭5行）</b></div>
    <div style="margin-bottom:8px;color:#555">${summary}</div>
    <div style="overflow-x:auto"><table>
      <thead><tr>${Object.keys(records[0]||{}).slice(0,6).map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
      <tbody>${records.slice(0,5).map(r=>`<tr>${Object.keys(records[0]).slice(0,6).map(k=>`<td>${esc(String(r[k]||''))}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div>
  </div>`;
}

function applyImport() {
  if (!pendingImportData) return;
  const type = document.querySelector('input[name="import-type"]:checked').value;
  const applyBtn = document.getElementById('import-apply-btn');
  applyBtn.disabled = true; applyBtn.style.opacity = '.5';

  if (type==='links') {
    const valid = pendingImportData.filter(r=>r[LINK_ITEM_KEY]&&r[LINK_UNIT_KEY]);
    DB.links = valid.map(r=>({[LINK_ITEM_KEY]:r[LINK_ITEM_KEY],[LINK_UNIT_KEY]:r[LINK_UNIT_KEY]}));
    closeImport(); renderSidebar(); renderDetail();
    alert(`リンク取込完了：${valid.length}件（全件置換）`);
    return;
  }

  const idKey = type==='items' ? ITEM_SERIES_KEY : UNIT_ID_KEY;
  const arr = type==='items' ? DB.items : DB.units;
  // Build Map for O(1) index lookup
  const idxMap = new Map(arr.map((x,i)=>[x[idKey], i]));
  const toAdd = [];
  let updateCount = 0;
  const CHUNK = 2000;
  const data = pendingImportData;
  let i = 0;

  setImportProgress(true, '取込処理中...', 0);

  function processChunk() {
    const end = Math.min(i + CHUNK, data.length);
    for (; i < end; i++) {
      const r = data[i];
      const id = r[idKey];
      if (!id) continue;
      if (idxMap.has(id)) {
        const idx = idxMap.get(id);
        arr[idx] = {...arr[idx], ...r};
        updateCount++;
      } else {
        const newRec = {...r, _id: Date.now()+Math.random()};
        toAdd.push(newRec);
        idxMap.set(id, arr.length + toAdd.length - 1);
      }
    }
    const pct = Math.round(i / data.length * 100);
    setImportProgress(true, `取込処理中... ${pct}% (${i}/${data.length}件)`, pct);
    if (i < data.length) {
      setTimeout(processChunk, 0);
    } else {
      // Commit additions
      toAdd.forEach(r => arr.push(r));
      setImportProgress(false);
      closeImport();
      renderSidebar();
      renderDetail();
      alert(`取込完了：更新 ${updateCount}件、新規 ${toAdd.length}件`);
    }
  }
  setTimeout(processChunk, 0);
}

document.getElementById('import-modal').addEventListener('click', e=>{
  if(e.target===document.getElementById('import-modal')) closeImport();
});

function downloadCSV(csv, fname) {
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = fname;
  a.click();
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Search
document.getElementById('search').addEventListener('input', e=>{
  currentSearchQuery = e.target.value;
  renderSidebar();
});

// Close modal on overlay click
document.getElementById('modal').addEventListener('click', e=>{
  if(e.target===document.getElementById('modal')) closeModal();
});

// Init
renderSidebar();
renderDetail();
</script>
