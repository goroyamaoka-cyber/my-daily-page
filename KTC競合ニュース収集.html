<script>
/* ── ログイン ── */
function doLogin() {
  const user = document.getElementById('login-user').value.trim();
  const pass = document.getElementById('login-pass').value;
  if (user === 'ktc' && pass === 'ktc2026') {
    sessionStorage.setItem('ktc_auth', '1');
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('main-content').style.display = 'block';
  } else {
    document.getElementById('login-error').textContent = 'ユーザーIDまたはパスワードが正しくありません';
    document.getElementById('login-pass').value = '';
  }
}
function doLogout() {
  sessionStorage.removeItem('ktc_auth');
  document.getElementById('main-content').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-user').value = '';
  document.getElementById('login-pass').value = '';
  document.getElementById('login-error').textContent = '';
}
document.getElementById('login-pass').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});
if (sessionStorage.getItem('ktc_auth') === '1') {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('main-content').style.display = 'block';
}

const COMPANIES  = [...new Set(NEWS.map(n => n.company))];
const CATEGORIES = ["新製品","DX・技術","業績","海外展開","展示会","その他"];
const TODAY = '2025-10-28', YESTERDAY = '2025-10-27';
const PORDER = { '高':0, '中':1, '低':2 };
const PBAR   = { '高':'bar-high', '中':'bar-mid', '低':'bar-low' };
const PDOT   = { '高':'dot-high', '中':'dot-mid', '低':'dot-low' };

let activeCompanies      = new Set(COMPANIES);
let activeDateFilter     = 'today';
let activePriorityFilter = 'all';
let activeCategoryFilter = 'all';

function switchTab(name, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
}

function initCompanyFilter() {
  const el = document.getElementById('company-filter');
  COMPANIES.forEach(c => {
    const tag = document.createElement('span');
    tag.className = 'c-tag active';
    tag.textContent = c;
    tag.onclick = () => {
      activeCompanies.has(c) ? activeCompanies.delete(c) : activeCompanies.add(c);
      tag.classList.toggle('active', activeCompanies.has(c));
      render();
    };
    el.appendChild(tag);
  });
}

function selectAll() {
  activeCompanies = new Set(COMPANIES);
  document.querySelectorAll('.c-tag').forEach(t => t.classList.add('active'));
  render();
}
function deselectAll() {
  activeCompanies.clear();
  document.querySelectorAll('.c-tag').forEach(t => t.classList.remove('active'));
  render();
}
function filterDate(val, btn) {
  activeDateFilter = val;
  btn.closest('.filter-options').querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}
function filterPriority(val, btn) {
  activePriorityFilter = val;
  btn.closest('.filter-options').querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}
function filterCategory(val, btn) {
  activeCategoryFilter = val;
  btn.closest('.filter-options').querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function filteredNews() {
  return NEWS.filter(n => {
    if (!activeCompanies.has(n.company)) return false;
    if (activeDateFilter === 'today'     && n.date !== TODAY)      return false;
    if (activeDateFilter === 'yesterday' && n.date !== YESTERDAY)  return false;
    if (activePriorityFilter !== 'all'   && n.priority !== activePriorityFilter) return false;
    if (activeCategoryFilter !== 'all'   && n.category !== activeCategoryFilter) return false;
    return true;
  }).sort((a, b) => PORDER[a.priority] - PORDER[b.priority]);
}

function render() {
  const data = filteredNews();
  document.getElementById('visible-count').textContent = data.length;
  const list = document.getElementById('article-list');
  list.innerHTML = '';
  data.forEach(n => {
    const div = document.createElement('div');
    div.className = 'article-item';
    div.innerHTML = `
      <div class="article-priority-bar ${PBAR[n.priority]}"></div>
      <div class="article-body">
        <div class="article-meta">
          <span class="meta-company">${n.company}</span>
          <span class="meta-sep">|</span>
          <span class="meta-category">${n.category}</span>
          <span class="meta-sep">|</span>
          <span>${n.date.replace(/-/g,'/')}</span>
          <span class="meta-sep">|</span>
          <span>${n.source}</span>
          <span class="meta-priority-dot ${PDOT[n.priority]}"></span>
          <span style="font-size:10px;color:#aaa">重要度：${n.priority}</span>
        </div>
        <div class="article-title"><a href="${n.url}" target="_blank" rel="noopener">${n.title}</a></div>
        <div class="article-excerpt">${n.excerpt}</div>
      </div>`;
    list.appendChild(div);
  });
}

function renderSummary() {
  document.getElementById('kpi-today').textContent      = NEWS.filter(n => n.date === TODAY).length;
  document.getElementById('kpi-newproduct').textContent = NEWS.filter(n => n.category === '新製品').length;
  document.getElementById('kpi-high').textContent       = NEWS.filter(n => n.priority === '高').length;
  document.getElementById('sum-high').textContent       = NEWS.filter(n => n.priority === '高').length;
  document.getElementById('sum-mid').textContent        = NEWS.filter(n => n.priority === '中').length;
  document.getElementById('sum-low').textContent        = NEWS.filter(n => n.priority === '低').length;

  const catCount = {};
  CATEGORIES.forEach(c => catCount[c] = 0);
  NEWS.forEach(n => catCount[n.category]++);
  const catMax = Math.max(...Object.values(catCount));
  document.getElementById('chart-category').innerHTML = CATEGORIES.map(cat => `
    <div class="bc-row">
      <div class="bc-label">${cat}</div>
      <div class="bc-track">
        <div class="bc-fill bc-${cat}" style="width:${(catCount[cat]/catMax*100).toFixed(1)}%">
          <span class="bc-val">${catCount[cat]}</span>
        </div>
      </div>
    </div>`).join('');

  const coCount = {};
  COMPANIES.forEach(c => coCount[c] = 0);
  NEWS.forEach(n => coCount[n.company]++);
  const coMax = Math.max(...Object.values(coCount));
  document.getElementById('chart-company').innerHTML = COMPANIES.map(co => `
    <div class="bc-row">
      <div class="bc-label">${co}</div>
      <div class="bc-track">
        <div class="bc-fill bc-company" style="width:${(coCount[co]/coMax*100).toFixed(1)}%">
          <span class="bc-val">${coCount[co]}</span>
        </div>
      </div>
    </div>`).join('');
}

initCompanyFilter();
renderSummary();
render();
</script>
